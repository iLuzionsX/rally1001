name: Anonymous Netlify Rally Preview
on:
  push:
    branches: [deploy/netlify-anonymous-audio-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netlify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static rally
        run: pnpm exec vite build --config vite.netlify.config.ts
      - name: Check static assets
        run: |
          test -s dist-netlify/index.html
          test -s dist-netlify/assets/models/subaru-rally.glb
          test -s dist-netlify/assets/models/ford-rally.glb
      - name: Deploy anonymously to Netlify
        env:
          CI: true
        run: |
          npx --yes netlify-cli@latest deploy --dir=dist-netlify --no-build --allow-anonymous --json > netlify-deployment.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const info=JSON.parse(fs.readFileSync('netlify-deployment.json','utf8'));
          const url=info.deploy_url||info.ssl_url||info.url;
          if(!url)throw Error('Netlify returned no deployment URL');
          console.log('Preview: '+url);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Anonymous Netlify preview\n\n'+url+'\n\nThis unclaimed preview expires after one hour.\n');
          JS
